services:
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - /frontend/node_modules
      - ./frontend:/frontend

  products-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypasswordProducts
      POSTGRES_DB: products_db
    volumes:
      - products_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  products-microservice:
    build: ./backend/products-microservice
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      products-db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/products-microservice:/products-microservice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      DB_CONN: "user=postgres password=mypasswordProducts dbname=products_db host=products-db sslmode=disable"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: myredispassword

  products-migration:
    build: ./backend/products-migration-service
    restart: "no"
    depends_on:
      products-db:
        condition: service_healthy
    environment:
      DB_CONN: "user=postgres password=mypasswordProducts dbname=products_db host=products-db sslmode=disable"

  orders-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypasswordOrders
      POSTGRES_DB: orders_db
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-microservice:
    build: ./backend/orders-microservice
    restart: always
    ports:
      - "8091:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/orders-microservice:/orders-microservice
    environment:
      DB_CONN: "user=postgres password=mypasswordOrders dbname=orders_db host=orders-db sslmode=disable"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: myredispassword

  orders-migration:
    build: ./backend/orders-migration-service
    restart: "no"
    depends_on:
      orders-db:
        condition: service_healthy
    environment:
      DB_CONN: "user=postgres password=mypasswordOrders dbname=orders_db host=orders-db sslmode=disable"

  authorization-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypasswordAuthorization
      POSTGRES_DB: authorization_db
    volumes:
      - authorization_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  authorization-microservice:
    build: ./backend/authorization-microservice
    restart: always
    ports:
      - "8093:8080"
    depends_on:
      authorization-db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/authorization-microservice:/authorization-microservice
    environment:
      JWT_SECRET: 8fhj3k4j5h2k3j4h5k6j7h8k9j2h3j4k5h6j7h8k9j0k1j2h3g4f5d6s7a8s9d0f
      DB_CONN: "user=postgres password=mypasswordAuthorization dbname=authorization_db host=authorization-db sslmode=disable"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: myredispassword

  authorization-migration:
    build: ./backend/authorization-migration-service
    restart: "no"
    depends_on:
      authorization-db:
        condition: service_healthy
    environment:
      DB_CONN: "user=postgres password=mypasswordAuthorization dbname=authorization_db host=authorization-db sslmode=disable"

  admin-microservice:
    build: ./backend/admin-microservice
    restart: always
    ports:
      - "8092:8080"
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: myredispassword
      PRODUCTS_SERVICE_URL: http://products-microservice:8080
      ORDERS_SERVICE_URL: http://orders-microservice:8080
    volumes:
      - ./backend/admin-microservice:/admin-microservice

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass myredispassword

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
    - "6080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGPASSFILE: /pgpass
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpass:/pgpass
    user: "root"

  telegram-microservice:
    build: ./backend/telegram-microservice
    restart: always
    ports:
      - "8094:8080"
    volumes:
      - ./backend/telegram-microservice:/telegram-microservice

